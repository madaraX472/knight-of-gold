<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Knight of the Gold</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* استدعاء الصورة المرفوعة مع لون احتياطي */
            background: #0d0f17 url('d9e6f5235474c404892c644be2f6dff4.jpg') no-repeat center center fixed;
            
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            padding: 15px 15px 80px 15px;
            overflow: hidden;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
        }

        /* رسالة الترحيب علوية */
        .welcome-banner {
            text-align: center;
            margin-bottom: 12px;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.8), 0 2px 8px rgba(0,0,0,0.9);
        }

        .welcome-banner h1 {
            font-size: 11px;
            letter-spacing: 2px;
            color: #e2e8f0;
            font-weight: 600;
        }

        .welcome-banner h2 {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(180deg, #ffe066, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* كارد الإحصائيات */
        .header-stats {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 10px 16px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }

        .stat-box h4 {
            font-size: 10px;
            color: #94a3b8;
        }

        .stat-box p {
            font-size: 14px;
            font-weight: bold;
            color: #f59e0b;
        }

        /* عرض الرصيد */
        .balance-container {
            text-align: center;
            margin: 5px 0;
        }

        .balance-title {
            font-size: 12px;
            color: #cbd5e1;
        }

        .balance-value {
            font-size: 36px;
            font-weight: 900;
            color: #fbbf24;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* العملة المصممة بـ CSS */
        .coin-wrapper {
            position: relative;
            margin: 25px 0;
            cursor: pointer;
        }

        .gold-coin {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffe066 0%, #f5af19 50%, #e65c00 100%);
            border: 6px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6), inset 0 0 15px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.05s ease;
        }

        .gold-coin:active {
            transform: scale(0.93);
        }

        .coin-icon {
            font-size: 55px;
        }

        .coin-text {
            font-size: 12px;
            font-weight: 900;
            color: #5c2c00;
            letter-spacing: 1px;
        }

        /* التأثير الطائر */
        .floating-num {
            position: absolute;
            font-size: 26px;
            font-weight: bold;
            color: #5eead4;
            text-shadow: 0 0 10px rgba(94, 234, 212, 0.8);
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.2); }
        }

        .energy-card {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 15px;
            border-radius: 12px;
            margin-top: auto;
        }

        /* القائمة السفلية */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            font-size: 10px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #f59e0b;
        }

        .nav-item span {
            font-size: 18px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="content">
        <div class="welcome-banner">
            <h1>WELCOME TO THE WORLD OF</h1>
            <h2>GOLD WARRIOR ⚔️</h2>
        </div>

        <div class="header-stats">
            <div class="stat-box">
                <h4>نهاية الموسم ⏳</h4>
                <p>19 يوم 23:59</p>
            </div>
            <div class="stat-box" style="text-align: left;">
                <h4>ربح التعدين/سا ⛏️</h4>
                <p>+1,000 GW</p>
            </div>
        </div>

        <div class="balance-container">
            <span class="balance-title">رصيد عملات Gold Warrior</span>
            <div class="balance-value">
                <span id="balance">0</span>
                <span style="font-size: 22px;">🪙</span>
            </div>
        </div>

        <div class="coin-wrapper" id="coinCard" onclick="handleTap(event)">
            <div class="gold-coin">
                <div class="coin-icon">⚔️</div>
                <div class="coin-text">GW COIN</div>
            </div>
        </div>

        <div class="energy-card">
            <span>⚡ <strong id="energy">1000</strong> / 1000</span>
            <span style="color: #cbd5e1; font-size: 11px;">انقر لتجميع الذهب</span>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active">
            <span>🪙</span>
            النقر
        </div>
        <div class="nav-item" onclick="alert('قسم التعدين قيد التطوير')">
            <span>⛏️</span>
            التعدين
        </div>
        <div class="nav-item" onclick="alert('قسم الغارات قيد التطوير')">
            <span>⚔️</span>
            الغارة
        </div>
        <div class="nav-item" onclick="alert('قسم الإعلانات قيد التطوير')">
            <span>📺</span>
            المهام
        </div>
        <div class="nav-item" onclick="alert('قسم المحفظة قيد التطوير')">
            <span>💼</span>
            المحفظة
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 0;
        let energy = 1000;

        function handleTap(event) {
            if (energy <= 0) return;

            balance += 1;
            energy -= 1;
            document.getElementById('balance').innerText = balance.toLocaleString();
            document.getElementById('energy').innerText = energy;

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }

            let coinWrapper = document.getElementById('coinCard');
            let rect = coinWrapper.getBoundingClientRect();
            let x = event.clientX - rect.left;
            let y = event.clientY - rect.top;

            let num = document.createElement('div');
            num.className = 'floating-num';
            num.innerText = '+1';
            num.style.left = `${x}px`;
            num.style.top = `${y}px`;

            coinWrapper.appendChild(num);

            setTimeout(() => { num.remove(); }, 800);
        }

        setInterval(() => {
            if (energy < 1000) {
                energy += 2;
                if (energy > 1000) energy = 1000;
                document.getElementById('energy').innerText = energy;
            }
        }, 1000);
    </script>
</body>
</html>
