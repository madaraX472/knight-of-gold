<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Knight of Gold</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #0d0f17 url('d9e6f5235474c404892c64ca6e8472e4.jpg?v=2') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            color: #fff;
            padding-bottom: 75px;
            overflow: hidden;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 15, 23, 0.65);
            backdrop-filter: blur(8px);
            z-index: 1;
        }

        .app-container {
            position: relative;
            z-index: 2;
            max-width: 430px;
            margin: 0 auto;
            padding: 15px;
            height: 100vh;
        }

        /* Top Bar Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .user-pill {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .stats-pills {
            display: flex;
            gap: 8px;
        }

        .stat-pill {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.25);
            padding: 6px 12px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            color: #ffd700;
        }

        .tournament-card {
            background: linear-gradient(135deg, rgba(49, 36, 89, 0.85), rgba(21, 16, 43, 0.9));
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 20px;
            padding: 14px;
            text-align: center;
            margin-bottom: 15px;
        }

        .tournament-title { font-size: 14px; font-weight: 800; color: #f1f5f9; }
        .prize-pool { font-size: 12px; color: #cbd5e1; }
        .prize-pool span { color: #ffd700; font-weight: 800; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Main Game Screen */
        .hero-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 55vh;
        }

        .hero-character {
            font-size: 100px;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6));
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .start-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            color: #fff;
            padding: 14px 50px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 25px;
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
            cursor: pointer;
        }

        /* Leaderboard */
        .leaderboard-list { display: flex; flex-direction: column; gap: 8px; }
        .leaderboard-item {
            background: rgba(30, 27, 55, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .leaderboard-item.user-card {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), rgba(30, 27, 55, 0.9));
            border: 1.5px solid #f59e0b;
        }

        .rank-info { display: flex; align-items: center; gap: 10px; }
        .rank-num { font-weight: 900; font-size: 14px; width: 30px; color: #94a3b8; }
        .player-avatar { width: 35px; height: 35px; border-radius: 50%; background: #3b82f6; display: flex; align-items: center; justify-content: center; }
        .player-name { font-size: 13px; font-weight: 700; }
        .reward-amount { font-weight: 800; font-size: 13px; color: #ffd700; }

        /* Canvas Game Container */
        #gameCanvasContainer {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0d0f17 url('d9e6f5235474c404892c64ca6e8472e4.jpg?v=2') no-repeat center center fixed;
            background-size: cover;
            z-index: 200;
        }

        canvas { display: block; margin: 0 auto; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 65px;
            background: rgba(13, 17, 23, 0.92);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #64748b;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            background: none; border: none; width: 20%;
        }

        .nav-btn.active { color: #f59e0b; }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="app-container">
        <!-- Top Header -->
        <div class="top-bar">
            <div class="user-pill">
                <span>🛡️</span>
                <span id="username">Warrior</span>
            </div>
            <div class="stats-pills">
                <div class="stat-pill">
                    🪙 <span id="coinCount">113</span>
                </div>
                <div class="stat-pill" style="color: #f59e0b;">
                    🎟️ <span id="ticketCount">35</span>
                </div>
            </div>
        </div>

        <div class="tournament-card">
            <div class="tournament-title">Gold Warrior Tournament ⚔️</div>
            <div class="prize-pool">Prize Pool: <span>4,000,000 $GW</span></div>
        </div>

        <!-- TAB 1: GAME SCREEN -->
        <div id="gameTab" class="tab-content active">
            <div class="hero-section">
                <div class="hero-character">🥷</div>
                <button class="start-btn" onclick="launchGame()">Start 🎟️</button>
            </div>
        </div>

        <!-- TAB 2: LEADERBOARD -->
        <div id="leaderboardTab" class="tab-content">
            <div class="leaderboard-item user-card">
                <div class="rank-info">
                    <span class="rank-num" style="color:#f59e0b;">#105</span>
                    <div class="player-avatar" style="background:#f59e0b;">🥷</div>
                    <span class="player-name" id="userRankName">Warrior (You)</span>
                </div>
                <div><span class="reward-amount" id="userRankCoins">113 🪙</span></div>
            </div>
            <div class="leaderboard-list">
                <div class="leaderboard-item">
                    <div class="rank-info">
                        <span class="rank-num" style="color:#ffd700;">#1</span>
                        <div class="player-avatar" style="background:#f59e0b;">👑</div>
                        <span class="player-name">Kinzar</span>
                    </div>
                    <span class="reward-amount">500,000 🪙</span>
                </div>
                <div class="leaderboard-item">
                    <div class="rank-info">
                        <span class="rank-num" style="color:#e2e8f0;">#2</span>
                        <div class="player-avatar" style="background:#64748b;">⚔️</div>
                        <span class="player-name">Teteshka</span>
                    </div>
                    <span class="reward-amount">360,000 🪙</span>
                </div>
            </div>
        </div>

        <!-- PLACEHOLDERS -->
        <div id="shopTab" class="tab-content" style="text-align: center; padding: 40px 0;"><h3>Shop 🛍️</h3></div>
        <div id="earnTab" class="tab-content" style="text-align: center; padding: 40px 0;"><h3>Earn Ads 📺</h3></div>
        <div id="walletTab" class="tab-content" style="text-align: center; padding: 40px 0;"><h3>Wallet 💼</h3></div>
    </div>

    <!-- Canvas Canvas Area -->
    <div id="gameCanvasContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('gameTab', this)"><i class="fa-solid fa-gamepad"></i><span>Game</span></button>
        <button class="nav-btn" onclick="switchTab('shopTab', this)"><i class="fa-solid fa-store"></i><span>Shop</span></button>
        <button class="nav-btn" onclick="switchTab('leaderboardTab', this)"><i class="fa-solid fa-trophy"></i><span>Leaderboard</span></button>
        <button class="nav-btn" onclick="switchTab('earnTab', this)"><i class="fa-solid fa-sack-dollar"></i><span>Earn</span></button>
        <button class="nav-btn" onclick="switchTab('walletTab', this)"><i class="fa-solid fa-wallet"></i><span>Wallet</span></button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let coins = 113;
        let tickets = 35;

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            let name = tg.initDataUnsafe.user.first_name;
            document.getElementById('username').innerText = name;
            document.getElementById('userRankName').innerText = name + " (You)";
        }

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }

        /* --- Canvas Game Logic --- */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameLoop;
        let player, platforms, coinsList, monsters, boosters;
        let score = 0, collectedCoins = 0;

        function launchGame() {
            if (tickets <= 0) { alert("No tickets remaining!"); return; }
            tickets--;
            document.getElementById('ticketCount').innerText = tickets;

            document.getElementById('gameCanvasContainer').style.display = 'block';
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            player = {
                x: canvas.width / 2 - 20,
                y: canvas.height - 150,
                width: 40,
                height: 40,
                vy: -12,
                vx: 0,
                shield: false,
                boostTimer: 0
            };

            platforms = [
                { x: canvas.width / 2 - 50, y: canvas.height - 50, width: 100, height: 15 }
            ];
            for(let i = 0; i < 7; i++) {
                platforms.push({
                    x: Math.random() * (canvas.width - 80),
                    y: canvas.height - 120 - (i * 90),
                    width: 80,
                    height: 15
                });
            }

            coinsList = [];
            monsters = [];
            boosters = [];
            score = 0;
            collectedCoins = 0;

            window.addEventListener('deviceorientation', handleMotion);
            window.addEventListener('touchmove', handleTouch);

            updateGame();
        }

        function handleTouch(e) {
            let touchX = e.touches[0].clientX;
            if (touchX < canvas.width / 2) player.vx = -5;
            else player.vx = 5;
        }

        function handleMotion(e) {
            if (e.gamma) player.vx = e.gamma * 0.3;
        }

        function updateGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Physics
            player.vy += 0.4;
            player.x += player.vx;
            player.y += player.vy;

            // Screen edges
            if (player.x < 0) player.x = canvas.width;
            if (player.x > canvas.width) player.x = 0;

            // Camera movement
            if (player.y < canvas.height / 2) {
                let diff = canvas.height / 2 - player.y;
                player.y = canvas.height / 2;
                score += Math.floor(diff);

                platforms.forEach(p => {
                    p.y += diff;
                    if (p.y > canvas.height) {
                        p.y = 0;
                        p.x = Math.random() * (canvas.width - 80);
                        // Spawn coins or monsters
                        if (Math.random() < 0.4) coinsList.push({ x: p.x + 30, y: p.y - 25, collected: false });
                        if (Math.random() < 0.15) monsters.push({ x: p.x + 20, y: p.y - 30, alive: true });
                        if (Math.random() < 0.08) boosters.push({ x: p.x + 25, y: p.y - 30, type: '🚀' });
                    }
                });

                coinsList.forEach(c => c.y += diff);
                monsters.forEach(m => m.y += diff);
                boosters.forEach(b => b.y += diff);
            }

            // Platform collision
            platforms.forEach(p => {
                if (player.vy > 0 && player.x + player.width > p.x && player.x < p.x + p.width &&
                    player.y + player.height >= p.y && player.y + player.height <= p.y + 15) {
                    player.vy = -12;
                }
                // Draw platform
                ctx.fillStyle = '#f59e0b';
                ctx.fillRect(p.x, p.y, p.width, p.height);
            });

            // Draw & Collect Coins
            coinsList.forEach(c => {
                if (!c.collected) {
                    ctx.font = '20px Arial';
                    ctx.fillText('🪙', c.x, c.y);
                    if (Math.hypot(player.x - c.x, player.y - c.y) < 30) {
                        c.collected = true;
                        collectedCoins++;
                    }
                }
            });

            // Monsters
            monsters.forEach(m => {
                if (m.alive) {
                    ctx.font = '24px Arial';
                    ctx.fillText('👾', m.x, m.y);
                    if (Math.hypot(player.x - m.x, player.y - m.y) < 25) {
                        if (player.vy > 0) { m.alive = false; player.vy = -12; }
                        else gameOver();
                    }
                }
            });

            // Boosters
            boosters.forEach(b => {
                ctx.font = '22px Arial';
                ctx.fillText(b.type, b.x, b.y);
                if (Math.hypot(player.x - b.x, player.y - b.y) < 25) {
                    player.vy = -22; // Rocket Boost
                }
            });

            // Draw Player
            ctx.font = '36px Arial';
            ctx.fillText('🥷', player.x, player.y + player.height);

            // Draw HUD
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Arial';
            ctx.fillText(`Score: ${score}`, 20, 40);
            ctx.fillText(`🪙 ${collectedCoins}`, canvas.width - 80, 40);

            // Check Defeat
            if (player.y > canvas.height) gameOver();
            else gameLoop = requestAnimationFrame(updateGame);
        }

        function gameOver() {
            cancelAnimationFrame(gameLoop);
            coins += collectedCoins;
            document.getElementById('coinCount').innerText = coins;
            document.getElementById('userRankCoins').innerText = coins + ' 🪙';
            alert(`Game Over! Score: ${score} | Coins: +${collectedCoins}`);
            document.getElementById('gameCanvasContainer').style.display = 'none';
        }
    </script>
</body>
</html>
